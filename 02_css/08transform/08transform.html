<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드 뒤집기</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    .con {
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
    }

    .con .card {
      width: 100%;
      height: 100%;
      transition: .7s;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top;
      transform-style: preserve-3d;
    }

    .con:hover .card {
      transform: rotateX(180deg);
    }

    .face {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      backface-visibility: hidden;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .front {
      z-index: 2;
    }

    .back {
      transform: rotateX(180deg);
    }
  </style>
</head>

<body>
  <div class="con">
    <div class="card">
      <div class="face front">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTB1uxva0Ob9Lfz-4X2mYdjOUUmm3B9YxXvr7Dsn0CDCqi8-Bt2L7Oycjrl&s=10"
          alt="김채원앞면">
      </div>

      <div class="face back">
        <img src="https://img1.newsis.com/2026/10/02/NISI20261002_0002254581_web.jpg" alt="김채원뒷면">
      </div>
    </div><!-- //.card -->
  </div><!-- //.con -->
</body>

</html>
