<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>backface-visibility</title>
  <style>
    * {
      padding: 0;
      margin: 0;
    }

    .container {
      width: 200px;
      height: 200px;
      border: 1px solid #333;
      margin-left: 300px;
      position: relative;
    }

    .container .card {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: .6s;
      transform-origin: left;
      transform-style: preserve-3d;
    }

    .container:hover .card {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      font-size: 30px;
      color: #fff;
    }
    
    .front {
      background: red;
      z-index: 2;
    }

    .back {
      background: blue;
      transform: rotateY(180deg);
    }

    .hidden {
      backface-visibility: hidden;
      /* 3d 속성이기 때문에 parent가 3d 속성이 있고 transform-style: preseve-3d가 있어야 함 */
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="face front">
        front
      </div><!-- //.front -->
    </div><!-- //.card -->
  </div><!-- //.container -->

  <div class="container">
    <div class="card">
      <div class="face front hidden">
        front
      </div><!-- //.front -->
    </div><!-- //.card -->
  </div><!-- //.container -->

  <div class="container">
    <div class="card">
      <div class="face front hidden">
        front
      </div><!-- //.front -->

      <div class="face back hidden">
        back
      </div><!-- //.back -->
    </div><!-- //.card -->
  </div><!-- //.container -->
</body>

</html>
