<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition</title>
  <style>
    #btn {
      width: 100px; height: 50px;
    }

    .tr1 {
      width: 100px;
      height: 100px;
      background: red;
      border: 1px solid #000;
      border-radius: 50%;
      position: absolute;
      left: 50%; top:50%;
      margin: -50px 0 0 -50px;
      transition: 2s 3s ease-in-out;
    }

    .tr1.on {
      width: 200px;
      height: 200px;
      background: aqua;
      border: 3px dotted green;
      border-radius: 0;
      transform: rotate(270deg);
    }
  </style>
</head>

<body>
  <button type="button" id="btn">바꾸자</button>
  <div class="tr1">
  <script>
    document.getElementById('btn').addEventListener('click',()=>{
      document.querySelector('.tr1').classList.toggle('on');
    })</script>
  </div>
</body>

</html>
