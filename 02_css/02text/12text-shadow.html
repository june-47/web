<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>text-shadow</title>
  <link rel="stylesheet" href="https://www.bokbootlab.com/font-css/noonnu-419.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gothic+A1&display=swap" rel="stylesheet">
  <style>
    .ex {
      margin-top: 100px;
      border: 1px solid #ccc;
    }

    .s1 {
      font-size: 50px;
      text-shadow: 10px 10px 3px #f00;
    }

    .s2 {
      font-size: 100px;
      color: orange;
      text-shadow: -2px -2px 10px blue;
    }

    .s3 {
      /* KyoboHand */
      font-family: 'KyoboHand', sans-serif;
      font-size: 50px;
      color: #0f0;
      text-shadow: 4px 4px 24px purple;

    }

    .s4 {
      font-family: "Bebas Neue", sans-serif;
      font-size: 80px;
      text-decoration: line-through dotted pink 20px;
      text-shadow: -6px -6px 16px lightcoral;
    }

    .s5 {
      font-family: "Gothic A1", sans-serif;
      font-weight: 900;
      font-size: 100px;
      text-shadow: 0px 0px 24px black;
    }
  </style>
</head>

<body>
  <h1>text-shadow 속성</h1>
  <p>텍스트에 그림자 효과를 추가하는 속성</p>
  <p>text-shadow : 가로거리 세로거리 번짐정도 색상</p>
  <div class="ex">
    <h2 class="s1">HTML5</h2>
    <h2 class="s2">HTML5</h2>
    <h2 class="s3">HTML5</h2>
    <h2 class="s4">HTML5</h2>
    <h2 class="s5">HTML5</h2>
  </div>
</body>

</html>
