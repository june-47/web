<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말줄임표 : 두줄 이상 처리</title>
  <style>
    .ellipsis_2 {
      border: 1px solid #ccc;
      width: 300px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
    }
  </style>
</head>

<body>
  <p class="ellipsis_2">
    This is some text! This is some text! This is some text!
    This is some text! This is some text! This is some text!
  </p>
</body>

</html>
