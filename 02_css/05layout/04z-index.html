<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>z-index</title>
  <style>
    .wrap {
      width: 500px;
      height: 500px;
      background: rgba(0,255,255,0.5);
      position: absolute;
      inset: 0;
      margin: auto;
    }

    .box {
      width: 100px;
      height: 100px;
      background: hotpink;
      position: absolute;
      text-align: center;
      line-height: 100px;
      font-size: 24px;
    }

    .box1 {
      background: yellow;
      left: 50px;
      top: 50px;
      z-index: 5;
    }

    .box2 {
      background: green;
      left: 60px;
      top: 60px;
    }

    .box3 {
      left: 70px;
      top: 70px;
      background: blue;
      z-index: 2;
    }

    .box4 {
      background: red;
      left: 10px;
      top: 10px;
      z-index: -1;
    }

    .box5 {
      left: 90px;
      top: 90px;
      background: lightgreen;
      z-index: 6;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="box box1">1</div>
    <div class="box box2">2</div>
    <div class="box box3">3</div>
    <div class="box box4">4</div>
    <div class="box box5">5</div>
  </div>
</body>

</html>
