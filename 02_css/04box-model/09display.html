<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      margin: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    img {
      width: 300px;
    }

    #inline img:nth-child(2) {
      visibility: hidden;
    }

    #block img {
      display: block;

    }

    #block img:nth-child(2) {
      display: none;
    }

    ul {
      width: 500px;
      margin: 0 auto;
      background: #ccc;
    }

    li {
      background: khaki;
      width: 100px;
      display: inline;
      display: inline-block;
      /* ㄴ> 잘 안씀 */
    }

    a {
      /* a는 inline */
      color: inherit;
      text-decoration: none;
      background: lightcoral;
    }
  </style>
</head>

<body>
  <!-- #inline + tab키 하면 해당 id를 가진 div 자동완성 -->
  <div id="inline">
    <img
      src="https://www.harpersbazaar.co.kr/resources/online/online_image/2026/10/12/85c08f16-36a1-4abd-9eba-a4e76c7d753c.jpg"
      alt="김채원">
    <img
      src="https://www.harpersbazaar.co.kr/resources/online/online_image/2026/10/12/85c08f16-36a1-4abd-9eba-a4e76c7d753c.jpg"
      alt="김채원">
    <img
      src="https://www.harpersbazaar.co.kr/resources/online/online_image/2026/10/12/85c08f16-36a1-4abd-9eba-a4e76c7d753c.jpg"
      alt="김채원">
    </div>
    <div id="block">
    <img
      src="https://www.harpersbazaar.co.kr/resources/online/online_image/2026/10/12/85c08f16-36a1-4abd-9eba-a4e76c7d753c.jpg"
      alt="김채원">
    <img
      src="https://www.harpersbazaar.co.kr/resources/online/online_image/2026/10/12/85c08f16-36a1-4abd-9eba-a4e76c7d753c.jpg"
      alt="김채원">
     <img
      src="https://www.harpersbazaar.co.kr/resources/online/online_image/2026/10/12/85c08f16-36a1-4abd-9eba-a4e76c7d753c.jpg"
      alt="김채원">
  </div>
  <nav>
    <ul>
      <li><a href="">메뉴1</a></li>
      <li><a href="">메뉴2</a></li>
      <li><a href="">메뉴3</a></li>
      <li><a href="">메뉴4</a></li>
    </ul>
  </nav>
</body>

</html>
