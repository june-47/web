<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>JS Quiz - Function</title>
  <link rel="stylesheet" href="quiz.css">
</head>
<body>
  <h1>Function 퀴즈</h1>
  <p>각 주석을 읽고 함수를 작성한 뒤 저장 → 브라우저 새로고침.</p>
  <div id="result"></div>

  <script src="quiz.js"></script>
  <script>
    // [문제 1] 함수 선언문
    // 두 수를 받아 더한 값을 반환하는 함수 add(a, b) 를 만들어라.
    // 여기에 작성


    check(1, typeof add === 'function' ? add(3, 4) : 'add 함수 없음', 7);


    // [문제 2] 함수 표현식
    // 함수 표현식으로 두 수 중 큰 수를 반환하는 변수 max 를 만들어라. (const max = function ...)
    // 여기에 작성


    check(2, typeof max === 'function' ? max(10, 25) : 'max 함수 없음', 25);


    // [문제 3] 화살표 함수
    // 숫자 하나를 받아 제곱한 값을 반환하는 화살표 함수 square 를 만들어라. (한 줄로)
    // 여기에 작성


    check(3, typeof square === 'function' ? square(9) : 'square 함수 없음', 81);


    // [문제 4] 기본 매개변수
    // 이름을 받아 '안녕하세요, OOO님' 을 반환하는 greet(name) 함수를 만들어라.
    // 인자가 없으면 name 의 기본값은 '손님' 이다.
    // 여기에 작성


    check(4, typeof greet === 'function' ? greet('june') : 'greet 함수 없음', '안녕하세요, june님');
    check('4-2', typeof greet === 'function' ? greet() : 'greet 함수 없음', '안녕하세요, 손님님');


    // [문제 5] 조건 + 반환
    // 숫자를 받아 짝수면 true, 홀수면 false 를 반환하는 isEven(n) 을 만들어라.
    // 여기에 작성


    check(5, typeof isEven === 'function' ? [isEven(4), isEven(7)] : 'isEven 함수 없음', [true, false]);


    // [문제 6] 반복문 + 함수
    // n 을 받아 1부터 n 까지의 합을 반환하는 sumTo(n) 을 만들어라.
    // 여기에 작성


    check(6, typeof sumTo === 'function' ? sumTo(10) : 'sumTo 함수 없음', 55);


    // [문제 7] 나머지 매개변수 (rest)
    // 인자를 몇 개든 받아서 모두 더해 반환하는 sumAll(...nums) 를 만들어라.
    // 여기에 작성


    check(7, typeof sumAll === 'function' ? sumAll(1, 2, 3, 4, 5) : 'sumAll 함수 없음', 15);


    // [문제 8] 재귀 함수
    // n! (팩토리얼) 을 재귀로 구하는 factorial(n) 을 만들어라. factorial(0) = 1
    // 여기에 작성


    check(8, typeof factorial === 'function' ? factorial(5) : 'factorial 함수 없음', 120);


    // [문제 9] 콜백 함수
    // 숫자 배열 arr 과 콜백 fn 을 받아, 배열의 각 요소에 fn 을 적용한 새 배열을 반환하는
    // myMap(arr, fn) 을 만들어라. (내장 map 사용 금지, for 문으로 구현)
    // 여기에 작성


    check(9, typeof myMap === 'function' ? myMap([1, 2, 3], x => x * 10) : 'myMap 함수 없음', [10, 20, 30]);


    // [문제 10] 클로저
    // 호출할 때마다 1, 2, 3 ... 으로 증가한 값을 반환하는 카운터 함수를 만드는
    // makeCounter() 를 만들어라. (내부 변수는 외부에서 직접 접근 불가해야 함)
    // 여기에 작성


    if (typeof makeCounter === 'function') {
      const c1 = makeCounter();
      const c2 = makeCounter();
      c1(); c1();
      check(10, [c1(), c2()], [3, 1]);
    } else {
      check(10, 'makeCounter 함수 없음', [3, 1]);
    }
  </script>
</body>
</html>
