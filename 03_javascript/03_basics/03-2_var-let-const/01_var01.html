<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>변수</title>
</head>
<body>
  <script>
    var num1; // num1이라는 변수 선언
    console.log(num1);

    var num1 =2; //재선언이 가능함
    console.log(num1);

    num1 = '문자열'; //이미 선언 했더라도 값만 바꾸기, var 안쓰기(웬만하면)
    console.log(num1);
  </script>
</body>
</html>
