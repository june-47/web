<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reverse 메소드</title>
  </head>
  <body>
    <script>
      let data = ['김채원9', '김채원8', '김채원5', '김채원1']
      let rData = data.reverse();
      console.log(data.join('-'));
      console.log(rData.join('-'));
      // 기본 배열이 바뀜
    </script>
  </body>
</html>
