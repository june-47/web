<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body button:first-child {
      background: red;
      color: #fff;
    }
  </style>
</head>

<body>
  <button type="button" onclick="alert('터져서 없어짐 수고하세요')">터질듯한 버튼?</button>
  <button type="button" class="change_btn">글씨 바꾸기</button>
  <button type="button" class="reset_btn">전체바꿈</button>
  <button type="button" id="out">외부 스크립트</button>
  <p class="change">뭘까요?</p>
  <script>
    // crtl + / 한줄 주석
    /* 
      alt + shift + a
      여러줄 주석
    */
    document.querySelector('.change_btn').onclick = () => {
      // '='은 대입 연산자(오른쪽에 있는걸 왼쪽에 넣음)
      document.querySelector('.change').innerHTML = '<em>hello world</em>'
    }
  </script>
  <script>
    document.querySelector('.reset_btn').onclick = function() {
      document.write('<h1>자바스크립트 엄청 재미있어요</h1>')
    }
  </script>
  <script src="./js/01test.js"></script>
</body>

</html>
