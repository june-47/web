<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin-bottom: 4px;
    }

    em {
      color: red;
    }
  </style>
</head>

<body>
  <form>
    <ul>
      <li>
        <!-- autofocus : 페이지를 불러오자마자 원하는 폼 요소에 마우스 커서 표시-->
        <label for="name">이름</label>
        <input type="text" id="name" autofocus>
      </li><!-- // -->
      <li>
        <!-- placeholder : 입력란에 표시하는 힌트로 필드를 클릭하면 사라짐 -->
        <label for="s_id">학번</label>
        <input type="tel" id="s_id" placeholder="하이픈 없이 입력">
      </li><!-- // -->
      <li>
        <!-- readonly : 내용을 보기만 하고 입력하지 못하게 함.-->
        <label for="r_only">읽기만함</label>
        <input type="text" id="r_only" value="못쳐요" readonly>
      </li><!-- // -->
      <li>
        <!-- required : 필수 필드 체크 -->
        <label for="n_name"><em>*</em>닉네임</label>
        <input type="text" id="n_name" required>
      </li><!-- // -->
      <li>
        <input type="submit" value="전송">
      </li><!-- // -->
    </ul>

  </form>
</body>

</html>
